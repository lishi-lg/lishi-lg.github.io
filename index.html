<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>El mundo de Lishi</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="hero">
    <img id="profile-photo" class="profile-photo" src="" alt="Foto de perfil" hidden />
    <h1 id="profile-name">Cargando…</h1>
    <p id="profile-bio"></p>
    <div id="profile-links" class="links"></div>
  </header>

  <main>
    <section id="projects-section">
      <h2>Proyectos</h2>
      <div id="projects-grid" class="projects-grid"></div>
      <p id="projects-empty" class="empty-msg" hidden>Todavía no hay proyectos publicados.</p>
    </section>
  </main>

  <footer>
    <p>&copy; <span id="year"></span> El mundo de Lishi</p>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
